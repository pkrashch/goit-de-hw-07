services:
  mysql:
    image: mysql:8.0
    command: --secure-file-priv=/data
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: olympic_dataset
      MYSQL_USER: airflow
      MYSQL_PASSWORD: airflow
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
      - ./data:/data:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      retries: 30

  airflow:
    image: apache/airflow:2.8.1
    command: standalone
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_CONN_GOIT_MYSQL_DB: mysql://airflow:airflow@mysql:3306/olympic_dataset
      _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-mysql==5.5.1
    volumes:
      - ./dags:/opt/airflow/dags
    ports:
      - "8080:8080"

volumes:
  mysql_data:
